[project]
name = "poker-tracker"
version = "0.1.0"
description = "Live poker analysis and statistics tracking tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "websockets>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = [
    "mss>=9.0.0",
    "opencv-python>=4.10.0",
    "pytesseract>=0.3.10",
    "numpy>=1.26.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
